<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Calculadora de Painel de LED</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#222;
  color:#fff;
}

h1{text-align:center;margin:10px 0;}

.container{
  display:flex;
  gap:20px;
  padding:20px;
}

.left{
  width:360px;
  background:#333;
  padding:15px;
  border-radius:8px;
  overflow-y:auto;
}

.right{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  height:calc(100vh - 120px); /* IMPORTANTE: trava crescimento */
}

label{display:block;margin-top:10px;font-weight:bold;}

input,select,button{
  width:100%;
  padding:8px;
  margin-top:4px;
  border-radius:6px;
  border:none;
}

input,select{background:#444;color:#fff;}

button{font-weight:bold;cursor:pointer;}

canvas{
  border:1px solid #555;
  border-radius:8px;
}

.btn-green{background:#28a745;}
.btn-blue{background:#2196f3;}
.btn-red{background:#e53935;}
.btn-orange{background:#ff9800;margin-top:6px;}
.btn-cyan{background:#03a9f4;margin-top:6px;}

footer{
  text-align:center;
  font-size:13px;
  color:#aaa;
  padding:10px;
}
</style>
</head>

<body>

<h1>Calculadora de Painel de LED</h1>

<div class="container">

<!-- CONTROLES -->
<div class="left">

<label>Layout do preview</label>
<select id="layout">
  <option value="test">Test Pattern</option>
  <option value="clean">Clean</option>
</select>

<label><input type="checkbox" id="grid" checked> Mostrar grid</label>
<label><input type="checkbox" id="numeros" checked> Mostrar numeração</label>

<label>Cor fundo (clean)</label>
<input type="color" id="cor" value="#ffffff">

<label>Logo do cliente</label>
<input type="file" id="logo" accept="image/*">

<label>Largura painel (m)</label>
<input id="largura" type="number" step="0.01">

<label>Altura painel (m)</label>
<input id="altura" type="number" step="0.01">

<label>Modelo</label>
<select id="modelo"></select>

<button class="btn-blue" id="btnNovo">➕ Novo painel</button>
<button class="btn-red" id="btnExcluir">🗑 Excluir painel</button>

<div id="boxNovo" style="display:none;margin-top:10px">
  <label>Nome</label><input id="npNome">
  <label>Largura (mm)</label><input id="npL">
  <label>Altura (mm)</label><input id="npA">
  <label>Pixels L</label><input id="npPxL">
  <label>Pixels A</label><input id="npPxA">
  <label>Potência média (W/m²)</label><input id="npMed">
  <label>Potência máx (W/m²)</label><input id="npMax">
  <label>Tensão (V)</label><input id="npV" value="220">
  <button class="btn-green" id="salvarPainel">Salvar</button>
</div>

<button class="btn-green" id="calcular">Calcular</button>
<button class="btn-orange" id="exportTech">📸 Exportar técnico</button>
<button class="btn-cyan" id="exportCliente">🧾 Exportar cliente</button>

</div>

<!-- PREVIEW -->
<div class="right">
  <canvas id="preview"></canvas>
</div>

</div>

<footer>
Desenvolvido por Rafonsky © <span id="ano"></span>
</footer>

<script>
/* =========================
   ESTADO GLOBAL
========================= */
const estado={
  painel:null,
  pl:0,
  pa:0,
  layout:"test",
  grid:true,
  numeros:true,
  cor:"#ffffff",
  logo:null
};

/* =========================
   TEST PATTERN
========================= */
const imgTestPattern=new Image();
imgTestPattern.src="test-pattern.png";

/* =========================
   LIMITES FIXOS DO PREVIEW
========================= */
let previewBounds=null;

function obterBoundsPreview(){
  if(previewBounds) return previewBounds;
  const r=preview.parentElement.getBoundingClientRect();
  previewBounds={w:r.width,h:r.height};
  return previewBounds;
}

/* =========================
   PAINÉIS (persistente)
========================= */
const paineis=JSON.parse(localStorage.getItem("paineis")) || {
  "Painel 50x100":{
    larguraMM:500,alturaMM:1000,
    pxL:168,pxA:336,
    medio:50,max:150,tensao:220
  }
};

function salvarPaineis(){
  localStorage.setItem("paineis",JSON.stringify(paineis));
}

function atualizarModelos(){
  modelo.innerHTML="";
  for(const p in paineis)
    modelo.innerHTML+=`<option>${p}</option>`;
}
atualizarModelos();

/* =========================
   EVENTOS UI
========================= */
layout.onchange=e=>{estado.layout=e.target.value; redraw();};
grid.onchange=e=>{estado.grid=e.target.checked; redraw();};
numeros.onchange=e=>{estado.numeros=e.target.checked; redraw();};
cor.oninput=e=>{estado.cor=e.target.value; redraw();};

logo.onchange=e=>{
  const r=new FileReader();
  r.onload=()=>{estado.logo=r.result; redraw();};
  r.readAsDataURL(e.target.files[0]);
};

btnNovo.onclick=()=>{
  boxNovo.style.display=boxNovo.style.display==="none"?"block":"none";
};

salvarPainel.onclick=()=>{
  paineis[npNome.value]={
    larguraMM:+npL.value,
    alturaMM:+npA.value,
    pxL:+npPxL.value,
    pxA:+npPxA.value,
    medio:+npMed.value,
    max:+npMax.value,
    tensao:+npV.value
  };
  salvarPaineis();
  atualizarModelos();
  boxNovo.style.display="none";
};

btnExcluir.onclick=()=>{
  if(confirm("Excluir painel?")){
    delete paineis[modelo.value];
    salvarPaineis();
    atualizarModelos();
  }
};

calcular.onclick=calcularPainel;

/* =========================
   CÁLCULO PRINCIPAL
========================= */
function calcularPainel(){
  const p=paineis[modelo.value];
  if(!p) return;

  const w=+largura.value;
  const h=+altura.value;

  estado.pl=Math.ceil(w*1000/p.larguraMM);
  estado.pa=Math.ceil(h*1000/p.alturaMM);
  estado.painel=p;

  redraw();
}

/* =========================
   DESENHO DO PREVIEW
========================= */
function redraw(){
  if(!estado.painel) return;
  desenharPreview(estado.pl,estado.pa,estado.painel);
}

function desenharPreview(pl,pa,p){
  const c=preview,ctx=c.getContext("2d");
  const {w:maxW,h:maxH}=obterBoundsPreview();

  const ratio=(pa*p.alturaMM)/(pl*p.larguraMM);
  let w=maxW,h=w*ratio;
  if(h>maxH){h=maxH;w=h/ratio;}

  /* Retina */
  c.width=w*2; c.height=h*2;
  c.style.width=w+"px";
  c.style.height=h+"px";
  ctx.setTransform(2,0,0,2,0,0);
  ctx.clearRect(0,0,w,h);

  /* Fundo */
  if(estado.layout==="test"){
    if(imgTestPattern.complete)
      ctx.drawImage(imgTestPattern,0,0,w,h);
  }else{
    ctx.fillStyle=estado.cor;
    ctx.fillRect(0,0,w,h);
  }

  /* Logo */
  if(estado.logo){
    const i=new Image();
    i.onload=()=>{
      const s=Math.min(w,h)*0.35/Math.max(i.width,i.height);
      ctx.drawImage(i,(w-i.width*s)/2,(h-i.height*s)/2,i.width*s,i.height*s);
    };
    i.src=estado.logo;
  }

  /* Grid */
  if(estado.grid){
    ctx.strokeStyle="rgba(255,255,255,.4)";
    for(let i=1;i<pl;i++){
      ctx.beginPath();
      ctx.moveTo(i*w/pl,0);
      ctx.lineTo(i*w/pl,h);
      ctx.stroke();
    }
    for(let j=1;j<pa;j++){
      ctx.beginPath();
      ctx.moveTo(0,j*h/pa);
      ctx.lineTo(w,j*h/pa);
      ctx.stroke();
    }
  }

  /* Numeração */
  if(estado.numeros){
    ctx.fillStyle="#fff";
    ctx.font="12px Arial";
    ctx.textAlign="center";
    for(let i=0;i<pl;i++)
      ctx.fillText(i+1,(i+.5)*w/pl,14);
    for(let j=0;j<pa;j++)
      ctx.fillText(j+1,14,(j+.5)*h/pa);
  }
}

/* =========================
   EXPORTAÇÃO
========================= */
function exportar(limpo){
  const g=estado.grid,n=estado.numeros;
  if(limpo){estado.grid=false;estado.numeros=false;}
  redraw();
  setTimeout(()=>{
    const a=document.createElement("a");
    a.download="painel-led.png";
    a.href=preview.toDataURL("image/png");
    a.click();
    estado.grid=g;estado.numeros=n;
    redraw();
  },50);
}

exportTech.onclick=()=>exportar(false);
exportCliente.onclick=()=>exportar(true);

/* =========================
   INIT
========================= */
ano.innerText=new Date().getFullYear();
</script>

</body>
</html>
